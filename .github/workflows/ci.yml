name: Supp Q CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build:h5

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: server/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/api ./cmd/worker ./cmd/admin ./cmd/migrate ./cmd/eval

  integration-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: server/go.sum
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: app
      - run: docker compose -f deploy/compose.dev.yml up -d --build
      - name: Wait for production-style readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready; then exit 0; fi
            sleep 2
          done
          docker compose -f deploy/compose.dev.yml logs
          exit 1
      - run: docker compose -f deploy/compose.dev.yml exec -T api /app/suppq-admin bootstrap-admin admin@suppq.local
      - run: make test-integration SUPPQ_TEST_DATABASE_URL='postgres://suppq:suppq_local_only@127.0.0.1:5432/suppq?sslmode=disable'
      - run: pnpm test:e2e
        working-directory: app
      - if: always()
        run: docker compose -f deploy/compose.dev.yml logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-e2e-evidence
          path: |
            compose.log
            app/playwright-report
            app/test-results
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f deploy/compose.dev.yml down
