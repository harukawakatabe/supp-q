openapi: 3.1.0
info:
  title: Supp Q API
  version: 0.1.0
  description: >-
    Phase 0 operational contract only. Product, identity, invitation, demo,
    recognition, AI, and reminder APIs are not implemented.
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Confirm that the API process is serving HTTP
      responses:
        "200":
          description: The process is live; dependency readiness is not asserted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
        "404":
          $ref: "#/components/responses/NotFound"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Confirm that the API can authenticate to PostgreSQL
      responses:
        "200":
          description: PostgreSQL accepted a ping within the configured timeout.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: PostgreSQL is unavailable or timed out.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessDegraded"
components:
  headers:
    RequestID:
      description: Opaque request identifier generated by the API.
      schema:
        type: string
        minLength: 1
  responses:
    NotFound:
      description: Route does not exist.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    HealthBase:
      type: object
      required: [status, service, version, requestId, timestamp]
      properties:
        status:
          type: string
        service:
          const: suppq-api
        version:
          type: string
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Liveness:
      allOf:
        - $ref: "#/components/schemas/HealthBase"
        - type: object
          properties:
            status:
              const: ok
    Readiness:
      allOf:
        - $ref: "#/components/schemas/HealthBase"
        - type: object
          required: [database]
          properties:
            status:
              const: ok
            database:
              const: ready
    ReadinessDegraded:
      allOf:
        - $ref: "#/components/schemas/HealthBase"
        - type: object
          required: [database]
          properties:
            status:
              const: degraded
            database:
              const: unavailable
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
