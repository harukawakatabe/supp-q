openapi: 3.1.0
info:
  title: Supp Q API
  version: 1.0.0-rc.1
  description: H5 launch-beta identity, deterministic domain, private uploads, evidence-first recognition, account cleanup, and operations contract.
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        "200": { description: Process is live, content: { application/json: { schema: { $ref: "#/components/schemas/Liveness" } } } }
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        "200": { description: PostgreSQL, private object storage, worker heartbeat, and recognition queue are ready, content: { application/json: { schema: { $ref: "#/components/schemas/Readiness" } } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /session:
    get:
      operationId: ensureSession
      summary: Return the active actor or create an isolated expiring demo actor
      responses:
        "200":
          description: Active session. A new HttpOnly cookie may be issued.
          headers: { Set-Cookie: { $ref: "#/components/headers/SessionCookie" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
  /auth/email-code/request:
    post:
      operationId: requestEmailCode
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EmailCodeRequest" } } }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/email-code/verify:
    post:
      operationId: verifyEmailCode
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EmailCodeVerify" } } }
      responses:
        "200":
          description: Registered session created; originating demo is queued for deletion.
          headers: { Set-Cookie: { $ref: "#/components/headers/SessionCookie" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/password/login:
    post:
      operationId: passwordLogin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasswordLogin" } } }
      responses:
        "200":
          description: Registered session created.
          headers: { Set-Cookie: { $ref: "#/components/headers/SessionCookie" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasswordReset" } } }
      responses:
        "200": { description: Password changed and all existing sessions invalidated. }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/logout:
    post:
      operationId: logout
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: Session invalidated and cookie cleared. }
  /account:
    delete:
      operationId: deleteAccount
      summary: Invalidate all sessions and queue object-first registered-account deletion
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties: { confirmation: { type: string, format: email, description: Must exactly match the active account email. } }
      responses:
        "202": { description: All sessions invalidated and durable cleanup queued. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/invitations:
    get:
      operationId: listInvitations
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Most recent invitation metadata. Secrets are never returned.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Invitation" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createInvitation
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateInvitation" } } }
      responses:
        "201":
          description: Invitation created. The plaintext secret is returned once.
          content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Invitation" }, { type: object, required: [secret], properties: { secret: { type: string } } }] } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Invitation revoked. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /products:
    get:
      operationId: listProducts
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Tenant-scoped active product projections, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Product" } } } } } } }
    post:
      operationId: createProduct
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateProduct" } } } }
      responses:
        "201": { description: Product, initial schedule, and opening batch committed atomically, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /products/{productId}:
    get:
      operationId: getProduct
      security: [{ sessionCookie: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Tenant-scoped product projection, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateProduct
      summary: Replace editable product fields and create a new schedule version
      security: [{ sessionCookie: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateProduct" } } } }
      responses:
        "200": { description: Updated tenant-scoped product projection, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /products/{productId}/batches:
    post:
      operationId: addInventoryBatch
      security: [{ sessionCookie: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BatchInput" } } } }
      responses:
        "201": { description: Independent inventory batch added, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /today:
    get:
      operationId: getToday
      security: [{ sessionCookie: [] }]
      parameters: [{ name: date, in: query, required: true, schema: { type: string, format: date } }]
      responses:
        "200": { description: Weekly, day-cycle, and long-cycle intersection with intake progress, content: { application/json: { schema: { type: object, required: [date, items], properties: { date: { type: string, format: date }, items: { type: array, items: { $ref: "#/components/schemas/TodayItem" } } } } } } }
  /intakes:
    get:
      operationId: listIntakes
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: Tenant-scoped intake records for a range of at most 366 days, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/IntakeRecord" } } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createIntake
      security: [{ sessionCookie: [] }]
      parameters: [{ name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 160 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateIntake" } } } }
      responses:
        "201": { description: Intake and exact FEFO allocation committed atomically, content: { application/json: { schema: { $ref: "#/components/schemas/IntakeMutation" } } } }
        "409": { description: Insufficient inventory; no partial mutation occurs }
  /intakes/{intakeId}:
    delete:
      operationId: undoIntake
      security: [{ sessionCookie: [] }]
      parameters: [{ name: intakeId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Intake revoked and its recorded allocations restored to the same batches; repeated calls are idempotent, content: { application/json: { schema: { $ref: "#/components/schemas/IntakeMutation" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /recognition/sets:
    post:
      operationId: createRecognitionSet
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [front, facts, expiry]
              properties:
                front: { type: string, format: binary }
                facts: { type: string, format: binary }
                expiry: { type: string, format: binary }
      responses:
        "202": { description: Three private files and three queued jobs persisted, content: { application/json: { schema: { $ref: "#/components/schemas/RecognitionSet" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /recognition/sets/{setId}:
    get:
      operationId: getRecognitionSet
      security: [{ sessionCookie: [] }]
      parameters: [{ name: setId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Tenant-scoped job and candidate state, content: { application/json: { schema: { $ref: "#/components/schemas/RecognitionSet" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /recognition/jobs/{jobId}/retry:
    post:
      operationId: retryRecognitionJob
      security: [{ sessionCookie: [] }]
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "202": { description: Persisted job requeued without deleting its file, content: { application/json: { schema: { $ref: "#/components/schemas/RecognitionSet" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /recognition/sets/{setId}/confirm:
    post:
      operationId: confirmRecognitionSet
      security: [{ sessionCookie: [] }]
      parameters: [{ name: setId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateProduct" } } } }
      responses:
        "201": { description: User-confirmed payload creates exactly one product, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "409": { description: Jobs are still processing }
  /files/{fileId}:
    get:
      operationId: getPrivateFile
      security: [{ sessionCookie: [] }]
      parameters: [{ name: fileId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Authorized private image bytes, headers: { Cache-Control: { schema: { const: "private, no-store" } } }, content: { image/jpeg: {}, image/png: {}, image/webp: {} } }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: suppq_session }
  headers:
    SessionCookie:
      description: HttpOnly, SameSite=Lax session cookie; Secure in production.
      schema: { type: string }
  responses:
    Accepted: { description: Request accepted, content: { application/json: { schema: { type: object, properties: { status: { const: accepted } } } } } }
    BadRequest: { description: Invalid request or credentials, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: Session required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: Admin role required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    TooManyRequests: { description: Email challenge rate limit reached, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    ServiceUnavailable: { description: Dependency unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  schemas:
    HealthBase:
      type: object
      required: [status, service, version, requestId, timestamp]
      properties:
        status: { type: string }
        service: { const: suppq-api }
        version: { type: string }
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    Liveness:
      allOf: [{ $ref: "#/components/schemas/HealthBase" }, { type: object, properties: { status: { const: ok } } }]
    Readiness:
      allOf: [{ $ref: "#/components/schemas/HealthBase" }, { type: object, required: [database, storage, worker, provider], properties: { status: { const: ok }, database: { const: ready }, storage: { const: ready }, worker: { const: ready }, provider: { type: string } } }]
    Actor:
      type: object
      required: [userId, kind, role, workspaceId, workspaceKind, workspaceName]
      properties:
        userId: { type: string, format: uuid }
        kind: { enum: [registered, demo_ephemeral] }
        role: { enum: [member, admin] }
        email: { type: string, format: email }
        workspaceId: { type: string, format: uuid }
        workspaceKind: { enum: [registered, demo] }
        workspaceName: { type: string }
        expiresAt: { type: string, format: date-time }
    Session:
      type: object
      required: [actor]
      properties: { actor: { $ref: "#/components/schemas/Actor" } }
    EmailCodeRequest:
      type: object
      required: [email, invitation]
      properties:
        email: { type: string, format: email }
        invitation: { type: string, description: Required only for a new account. }
    EmailCodeVerify:
      type: object
      required: [email, code, invitation, password]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: "^[0-9]{6}$" }
        invitation: { type: string }
        password: { type: string, minLength: 0, maxLength: 256, description: Optional; when present it binds password login to the same user. }
    PasswordLogin:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string, minLength: 1, maxLength: 256 } }
    PasswordReset:
      type: object
      required: [email, code, password]
      properties: { email: { type: string, format: email }, code: { type: string, pattern: "^[0-9]{6}$" }, password: { type: string, minLength: 10, maxLength: 256 } }
    CreateInvitation:
      type: object
      required: [kind, maxUses, expiresAt]
      properties:
        kind: { enum: [generic_code, email_bound] }
        email: { type: string, format: email, description: Required for email_bound. }
        maxUses: { type: integer, minimum: 1, maximum: 1000, description: Forced to one for email_bound. }
        expiresAt: { type: string, format: date-time }
    Invitation:
      type: object
      required: [id, kind, maxUses, useCount, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { enum: [generic_code, email_bound] }
        email: { type: string, format: email }
        maxUses: { type: integer }
        useCount: { type: integer }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    BatchInput:
      type: object
      required: [quantity]
      properties:
        quantity: { type: number, exclusiveMinimum: 0 }
        expiryDate: { type: string, format: date }
        priceCny: { type: number, minimum: 0 }
    ScheduleInput:
      type: object
      required: [startDate, weekdays, dayCycle, longCycle, reminderTimes]
      properties:
        startDate: { type: string, format: date }
        weekdays: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 6 } }
        dayCycle: { type: object, required: [enabled, cycleDays, takeDays, anchorDate], properties: { enabled: { type: boolean }, cycleDays: { type: integer, minimum: 1 }, takeDays: { type: integer, minimum: 1 }, anchorDate: { type: string, format: date } } }
        longCycle: { type: object, required: [enabled, takeWeeks, restWeeks, startDate], properties: { enabled: { type: boolean }, takeWeeks: { type: integer, minimum: 1 }, restWeeks: { type: integer, minimum: 0 }, startDate: { type: string, format: date } } }
        reminderTimes: { type: array, minItems: 1, maxItems: 8, items: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" } }
    CreateProduct:
      type: object
      required: [name, unit, doseQuantity, doseTimesPerDay, schedule, openingBatch]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        brand: { type: string, maxLength: 120 }
        productType: { enum: [supplement, otc, prescription] }
        unit: { type: string, minLength: 1, maxLength: 40 }
        doseQuantity: { type: number, exclusiveMinimum: 0 }
        doseTimesPerDay: { type: integer, minimum: 1, maximum: 8 }
        schedule: { $ref: "#/components/schemas/ScheduleInput" }
        openingBatch: { $ref: "#/components/schemas/BatchInput" }
        ingredientServingQuantity: { type: number, exclusiveMinimum: 0 }
        withFood: { type: boolean }
        restockThresholdDays: { type: integer, minimum: 0 }
        expiryReminderDays: { type: integer, minimum: 0 }
        ingredients: { type: array, items: { $ref: "#/components/schemas/IngredientInput" } }
    UpdateProduct:
      type: object
      required: [name, status, unit, doseQuantity, doseTimesPerDay, schedule, effectiveDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        brand: { type: string, maxLength: 120 }
        productType: { enum: [supplement, otc, prescription] }
        status: { enum: [active, paused, depleted] }
        unit: { type: string, minLength: 1, maxLength: 40 }
        doseQuantity: { type: number, exclusiveMinimum: 0 }
        doseTimesPerDay: { type: integer, minimum: 1, maximum: 8 }
        ingredientServingQuantity: { type: number, exclusiveMinimum: 0 }
        withFood: { type: boolean }
        restockThresholdDays: { type: integer, minimum: 0 }
        expiryReminderDays: { type: integer, minimum: 0 }
        schedule: { $ref: "#/components/schemas/ScheduleInput" }
        ingredients: { type: array, items: { $ref: "#/components/schemas/IngredientInput" } }
        effectiveDate: { type: string, format: date, description: Cannot be before the server's current date; protects historical day-cycle evaluation. }
    IngredientInput:
      type: object
      required: [key, name, amount, unit]
      properties:
        key: { type: string }
        name: { type: string }
        amount: { type: number, exclusiveMinimum: 0 }
        unit: { type: string }
    ScheduleView:
      allOf:
        - { $ref: "#/components/schemas/ScheduleInput" }
        - type: object
          required: [version, dayCycleHistory]
          properties:
            version: { type: integer, minimum: 1 }
            dayCycleHistory:
              type: array
              items:
                type: object
                required: [effectiveDate, enabled, cycleDays, takeDays, anchorDate]
                properties:
                  effectiveDate: { type: string, format: date }
                  enabled: { type: boolean }
                  cycleDays: { type: integer, minimum: 1 }
                  takeDays: { type: integer, minimum: 1 }
                  anchorDate: { type: string, format: date }
    Product:
      type: object
      required: [id, name, status, unit, doseQuantity, dailyQuantity, currentQuantity, schedule, batches, ingredients, expiryRisk]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        brand: { type: string }
        status: { enum: [active, paused, depleted] }
        unit: { type: string }
        doseQuantity: { type: number }
        dailyQuantity: { type: number }
        currentQuantity: { type: number }
        schedule: { $ref: "#/components/schemas/ScheduleView" }
        batches: { type: array, items: { type: object } }
        ingredients: { type: array, items: { type: object } }
        expiryRisk: { type: object, required: [level, message], properties: { level: { enum: [none, safe, warn, danger] }, message: { type: string }, expiryDate: { type: string, format: date }, projectedFinishDate: { type: string, format: date }, latestStartDate: { type: string, format: date } } }
    CreateIntake:
      type: object
      required: [productId, date, quantity, source]
      properties:
        productId: { type: string, format: uuid }
        date: { type: string, format: date }
        time: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
        quantity: { type: number, exclusiveMinimum: 0 }
        source: { enum: [scheduled, ad_hoc, backfill] }
        note: { type: string, maxLength: 500 }
    Intake:
      type: object
      required: [id, productId, date, quantity, source, status, createdAt, allocations]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        date: { type: string, format: date }
        time: { type: string }
        quantity: { type: number }
        source: { enum: [scheduled, ad_hoc, backfill] }
        status: { enum: [active, revoked] }
        note: { type: string }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        allocations: { type: array, items: { type: object, required: [batchId, quantity, unitCostCny], properties: { batchId: { type: string, format: uuid }, quantity: { type: number }, unitCostCny: { type: number } } } }
    IntakeRecord:
      allOf:
        - { $ref: "#/components/schemas/Intake" }
        - type: object
          required: [productName, productUnit]
          properties: { productName: { type: string }, productUnit: { type: string } }
    IntakeMutation:
      type: object
      required: [intake, product]
      properties:
        intake: { $ref: "#/components/schemas/Intake" }
        product: { $ref: "#/components/schemas/Product" }
    TodayItem:
      type: object
      required: [product, scheduledQuantity, takenQuantity, done, available]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        scheduledQuantity: { type: number }
        takenQuantity: { type: number }
        done: { type: boolean }
        available: { type: boolean }
        lastIntakeId: { type: string, format: uuid }
    RecognitionCandidate:
      type: object
      required: [status, confidence]
      properties:
        status: { enum: [recognized, partial, unrecognized] }
        language: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        rawText: { type: string }
        raw: { type: string }
        date: { type: string, format: date }
        fields: { type: object, additionalProperties: true }
    RecognitionJob:
      type: object
      required: [id, role, status, provider, attempt, maxAttempts, confidence]
      properties:
        id: { type: string, format: uuid }
        role: { enum: [front, facts, expiry] }
        status: { enum: [queued, running, succeeded, partial, failed, cancelled] }
        provider: { type: string, description: "pending, fake:development, or live:<provider>." }
        attempt: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        result: { $ref: "#/components/schemas/RecognitionCandidate" }
        ocrEvidence:
          type: object
          description: Verbatim OCR text persisted before the structuring request is made.
          required: [rawText, provider, model, durationMs, completedAt]
          properties:
            rawText: { type: string, maxLength: 30000 }
            provider: { type: string }
            model: { type: string }
            durationMs: { type: integer, minimum: 0 }
            completedAt: { type: string, format: date-time }
        trace:
          type: object
          required: [mode, selectedRoute]
          properties:
            mode: { enum: [fake, ocr_llm, direct_vl, dual] }
            selectedRoute: { enum: [fake, ocr_llm, direct_vl] }
            ocr: { $ref: "#/components/schemas/RecognitionStage" }
            structure: { $ref: "#/components/schemas/RecognitionStage" }
            direct: { $ref: "#/components/schemas/RecognitionStage" }
            directCandidate: { $ref: "#/components/schemas/RecognitionCandidate" }
        errorCode: { type: string }
        errorMessage: { type: string }
    RecognitionStage:
      type: object
      required: [provider, model, durationMs]
      properties:
        provider: { type: string }
        model: { type: string }
        durationMs: { type: integer, minimum: 0 }
    RecognitionSet:
      type: object
      required: [id, status, files, jobs, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { enum: [processing, awaiting_confirmation, confirmed, cancelled] }
        productId: { type: string, format: uuid }
        files: { type: array, minItems: 3, maxItems: 3, items: { type: object, required: [id, role, mimeType, byteSize], properties: { id: { type: string, format: uuid }, role: { enum: [front, facts, expiry] }, mimeType: { enum: [image/jpeg, image/png, image/webp] }, byteSize: { type: integer } } } }
        jobs: { type: array, minItems: 3, maxItems: 3, items: { $ref: "#/components/schemas/RecognitionJob" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties: { code: { type: string }, message: { type: string }, requestId: { type: string } }
