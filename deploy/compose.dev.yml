name: suppq-dev

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: suppq
      POSTGRES_USER: suppq
      POSTGRES_PASSWORD: suppq_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suppq -d suppq"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  object-storage:
    image: chrislusf/seaweedfs:4.29
    environment:
      AWS_ACCESS_KEY_ID: suppq_local
      AWS_SECRET_ACCESS_KEY: suppq_local_only
      S3_BUCKET: suppq-uploads
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:23646:23646"
    volumes:
      - object_data:/data
    command: ["mini", "-dir=/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/dir/status | grep -Eq '\"Free\":[1-9][0-9]*'"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_MAX_MESSAGES: "500"
      MP_MAX_MESSAGE_SIZE: "10485760"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  migrate:

    build:
      context: ../server
      dockerfile: Dockerfile
    command: ["/app/suppq-migrate"]
    environment:
      SUPPQ_ENV: development
      SUPPQ_DATABASE_URL: postgres://suppq:suppq_local_only@postgres:5432/suppq?sslmode=disable
      SUPPQ_TOKEN_PEPPER: suppq-development-pepper-not-for-production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    command: ["/app/suppq-api"]
    environment:
      SUPPQ_ENV: development
      SUPPQ_HTTP_ADDR: 0.0.0.0:8080
      SUPPQ_ALLOWED_ORIGIN: http://127.0.0.1:3000
      SUPPQ_DATABASE_URL: postgres://suppq:suppq_local_only@postgres:5432/suppq?sslmode=disable
      SUPPQ_DATABASE_TIMEOUT: 3s
      SUPPQ_TOKEN_PEPPER: suppq-development-pepper-not-for-production
      SUPPQ_SESSION_TTL: 720h
      SUPPQ_DEMO_TTL: 24h
      SUPPQ_EMAIL_CODE_TTL: 10m
      SUPPQ_SMTP_HOST: mailpit
      SUPPQ_SMTP_PORT: 1025
      SUPPQ_SMTP_FROM: 小补Q <no-reply@suppq.local>
      SUPPQ_OBJECT_ENDPOINT: object-storage:8333
      SUPPQ_OBJECT_ACCESS_KEY: suppq_local
      SUPPQ_OBJECT_SECRET_KEY: suppq_local_only
      SUPPQ_OBJECT_BUCKET: suppq-uploads
      SUPPQ_OBJECT_REGION: us-east-1
      SUPPQ_OBJECT_SECURE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/app/suppq-admin", "status"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ../server
      dockerfile: Dockerfile
    command: ["/app/suppq-worker"]
    environment:
      SUPPQ_ENV: development
      SUPPQ_DATABASE_URL: postgres://suppq:suppq_local_only@postgres:5432/suppq?sslmode=disable
      SUPPQ_DATABASE_TIMEOUT: 3s
      SUPPQ_WORKER_INTERVAL: 2s
      SUPPQ_TOKEN_PEPPER: suppq-development-pepper-not-for-production
      SUPPQ_SESSION_TTL: 720h
      SUPPQ_DEMO_TTL: 24h
      SUPPQ_EMAIL_CODE_TTL: 10m
      SUPPQ_OBJECT_ENDPOINT: object-storage:8333
      SUPPQ_OBJECT_ACCESS_KEY: suppq_local
      SUPPQ_OBJECT_SECRET_KEY: suppq_local_only
      SUPPQ_OBJECT_BUCKET: suppq-uploads
      SUPPQ_OBJECT_REGION: us-east-1
      SUPPQ_OBJECT_SECURE: "false"
      SUPPQ_RECOGNITION_PROVIDER: fake
      SUPPQ_RECOGNITION_TIMEOUT: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    restart: unless-stopped

  h5:
    build:
      context: ..
      dockerfile: app/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped

volumes:
  postgres_data:
  object_data:
