name: suppq-production

services:
  migrate:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: ${SUPPQ_SERVER_IMAGE:-suppq-server:local}
    command: ["/app/suppq-migrate"]
    env_file:
      - ${SUPPQ_API_ENV_FILE:-/etc/suppq/api.env}
    restart: "no"
    networks: [backend]

  api:
    image: ${SUPPQ_SERVER_IMAGE:-suppq-server:local}
    command: ["/app/suppq-api"]
    env_file:
      - ${SUPPQ_API_ENV_FILE:-/etc/suppq/api.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "/app/suppq-admin", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    networks: [backend]

  worker:
    image: ${SUPPQ_SERVER_IMAGE:-suppq-server:local}
    command: ["/app/suppq-worker"]
    env_file:
      - ${SUPPQ_WORKER_ENV_FILE:-/etc/suppq/worker.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    networks: [backend]

  h5:
    build:
      context: ..
      dockerfile: app/Dockerfile
    image: ${SUPPQ_H5_IMAGE:-suppq-h5:local}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777", "/config:size=4m", "/data:size=4m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    networks: [frontend]

  edge:
    image: caddy:2.11.4-alpine
    environment:
      SUPPQ_HOSTNAME: ${SUPPQ_HOSTNAME:?set SUPPQ_HOSTNAME}
      SUPPQ_ACME_EMAIL: ${SUPPQ_ACME_EMAIL:?set SUPPQ_ACME_EMAIL}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      api:
        condition: service_healthy
      h5:
        condition: service_started
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    restart: unless-stopped
    networks: [frontend, backend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
